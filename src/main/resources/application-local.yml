spring:
  config:
    activate:
      on-profile: local

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:tcp://localhost/~/dart
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-dart

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always
      data-locations: classpath:data.sql

  data:
    redis:
      host: localhost
      port: 6379

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 210MB

  security:
    oauth2:
      client:
        registration:
          kakao:
            provider: kakao
            client-id: test-kakao-client-id
            client-secret: test-secret
            redirect-uri: http://localhost:8080/oauth/kakao
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope: profile_nickname, profile_image, account_email
          google:
            provider: google
            client-id: test-google-client-id
            client-secret: test-secret
            redirect-uri: http://localhost:8080/oauth/google
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope: profile, email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

  mail:
    host: smtp.gmail.com
    port: 587
    username: dummy@example.com
    password: dummy-password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
    auth-code-expiration-millis: 300000

jwt:
  secret:
    access-key: thisIsASecretKeyThatIsSecureEnough32Chars
  access-expire: 3600000 # 1시간
  refresh-expire: 604800000 # 7일

kakao:
  admin-key: dummy-kakao-admin-key

cloud:
  aws:
    s3:
      bucket: test-bucket
    credentials:
      access-key: test-access
      secret-key: test-secret
    region:
      static: ap-northeast-2
    cloudfront:
      domain: test.cloudfront.net
